<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient 1 -->
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- CSS Animations -->
    <style>
      @keyframes pulseLight {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes nodeGlow {
        0%, 100% { r: 6px; opacity: 0.7; }
        50% { r: 9px; opacity: 1; }
      }
      @keyframes waveSlide {
        0% { transform: translateX(0); }
        50% { transform: translateX(-30px); }
        100% { transform: translateX(0); }
      }
      .pulse-bg {
        animation: pulseLight 6s ease-in-out infinite;
        transform-origin: center;
      }
      .floating {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .anim-dash {
        stroke-dasharray: 8, 6;
        animation: dashMove 12s linear infinite;
      }
      .anim-dash-fast {
        stroke-dasharray: 6, 6;
        animation: dashMove 6s linear infinite;
      }
      .glowing-node {
        animation: nodeGlow 3s ease-in-out infinite;
      }
      .wave-anim {
        animation: waveSlide 8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Card Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1196" height="356" x="2" y="2" rx="15" fill="none" stroke="url(#accentGrad1)" stroke-width="1.5" opacity="0.4" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="80" r="160" fill="#6366f1" opacity="0.15" class="pulse-bg" filter="url(#glow)" />
  <circle cx="1050" cy="280" r="180" fill="#06b6d4" opacity="0.15" class="pulse-bg" filter="url(#glow)" style="animation-delay: -3s;" />
  <circle cx="600" cy="180" r="220" fill="#a855f7" opacity="0.08" class="pulse-bg" filter="url(#glow)" style="animation-delay: -1.5s;" />

  <!-- Dynamic Circuit / Network Lines -->
  <g opacity="0.35">
    <path d="M 50 180 Q 200 80, 400 180 T 750 180 T 1150 180" fill="none" stroke="#38bdf8" stroke-width="2" class="anim-dash" />
    <path d="M 50 240 Q 300 320, 600 220 T 1150 120" fill="none" stroke="#a855f7" stroke-width="1.5" class="anim-dash-fast" />
    <path d="M 150 300 L 320 200 L 520 260 L 800 140 L 1050 220" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- Network Nodes with pulsing effect -->
  <g>
    <circle cx="150" cy="300" r="6" fill="#10b981" class="glowing-node" style="animation-delay: 0s;" />
    <circle cx="320" cy="200" r="6" fill="#38bdf8" class="glowing-node" style="animation-delay: 0.5s;" />
    <circle cx="520" cy="260" r="7" fill="#6366f1" class="glowing-node" style="animation-delay: 1s;" />
    <circle cx="800" cy="140" r="6" fill="#a855f7" class="glowing-node" style="animation-delay: 1.5s;" />
    <circle cx="1050" cy="220" r="7" fill="#06b6d4" class="glowing-node" style="animation-delay: 2s;" />
  </g>

  <!-- Central Content & Typography -->
  <g class="floating" transform="translate(0, 0)">
    <!-- Pill Badge -->
    <g transform="translate(425, 45)">
      <rect width="350" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.8" />
      <circle cx="20" cy="16" r="5" fill="#10b981" />
      <text x="35" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">CURATED ECOSYSTEM GUIDE • 2026</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#accentGrad1)" letter-spacing="-0.5" filter="url(#softGlow)">
      Awesome Open Banking Platform
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#e2e8f0" letter-spacing="0.2">
      Top Commercial SaaS Platforms &amp; Open-Source Projects for Open Banking &amp; PSD2/3
    </text>

    <!-- Feature Tags -->
    <g transform="translate(230, 235)">
      <!-- Tag 1: AIS & PIS -->
      <rect x="0" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="75" y="22" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ AIS &amp; PIS APIs</text>

      <!-- Tag 2: Account to Account -->
      <rect x="165" y="0" width="180" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="255" y="22" text-anchor="middle" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🏦 Pay-by-Bank (A2A)</text>

      <!-- Tag 3: PSD2 / FAPI -->
      <rect x="360" y="0" width="185" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="452" y="22" text-anchor="middle" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🔒 PSD2 / Open Finance</text>

      <!-- Tag 4: Developer Tools -->
      <rect x="560" y="0" width="180" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="650" y="22" text-anchor="middle" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🛠️ Developer Toolkits</text>
    </g>
  </g>

  <!-- Bottom Dynamic Wave Bar -->
  <path d="M 0 350 Q 300 330, 600 350 T 1200 350 L 1200 360 L 0 360 Z" fill="url(#accentGrad1)" opacity="0.6" class="wave-anim" />
</svg>
